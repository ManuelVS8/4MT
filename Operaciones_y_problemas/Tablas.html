<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Tablas de Multiplicar</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/ManuelVS8/Audios-juegos-SCIENCE/refs/heads/main/icono.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --blue-dark:#04032B; --blue-700:#1a3a5f; --blue-600:#254fba;
            --orange:#f59e42; --orange-700:#e67e22; --bg1:#1a3a5f; --bg2:#0d2340;
            --white:#fff; --green:#2ecc71; --red:#e74c3c; --panel:#E8EAFF;
            --success:#10b981; --danger:#ef4444;
            --text-light:#6b7280; --shadow:0 12px 24px rgba(0,0,0,.12); --tr:180ms ease;
        }
        body {
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 20px;
            color: var(--blue-dark);
        }
        .game-container {
            background: var(--white);
            border-radius: 20px;
            padding: 1.6rem;
            box-shadow: 0 16px 40px rgba(0,0,0,.18);
            text-align: center;
            max-width: 800px;
            width: 100%;
            min-height: 500px;
        }
        .screen { display: none; animation: fadeIn .4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
        h1 { color: var(--blue-dark); font-size: clamp(1.6rem,5vw,2.4rem); font-weight: 900; margin-bottom: .4rem; }
        .level-title { color: var(--blue-700); font-size: 1.5rem; font-weight: 800; margin-bottom: 15px; }
        .subtitle { color: var(--blue-700); font-size: clamp(.9rem,2.5vw,1.15rem); font-weight: 600; margin-bottom: 24px; }
        .level-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 320px;
            margin: 0 auto;
        }
        .btn {
            background: linear-gradient(135deg, var(--orange), var(--orange-700));
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 14px;
            font-size: 1.08rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.12);
            transition: transform .15s ease, box-shadow .25s ease, filter .2s ease;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.2); filter: brightness(1.05); }
        .btn:active { transform: translateY(-1px); }
        .btn-orange { background: linear-gradient(135deg, var(--orange), var(--orange-700)); }
        .btn-green  { background: linear-gradient(135deg, var(--green), #27ae60); }
        .btn-red    { background: linear-gradient(135deg, var(--red), #c0392b); }
        .btn-light-blue { background: linear-gradient(135deg, #8ecae6, #5fb8dd); color: var(--blue-dark); }
        .btn-dark-blue  { background: linear-gradient(135deg, var(--blue-700), var(--blue-600)); color: #fff; }
        .btn-blue   { background: linear-gradient(135deg, var(--blue-600), #1d3f96); color: #fff; }
        .table-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .game-area { margin: 20px 0; min-height: 300px; }
        .columns { display: flex; justify-content: space-between; gap: 20px; margin: 20px 0; }
        .column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: var(--white);
            border: 2px solid #e5e9f0;
            border-radius: 14px;
            padding: 15px;
            cursor: pointer;
            transition: all var(--tr);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--blue-700);
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,.06);
        }
        .card:hover { background: var(--panel); transform: scale(1.05); }
        .card.selected { background: var(--blue-600); color: #fff; border-color: var(--blue-600); }
        .card.correct { background: var(--success); color: #fff; border-color: var(--success); }
        .card.hidden { background: #ddd; color: transparent; border-color: #bbb; }
        .card.showing {}
        .card.hiding {}
        .question-area {
            background: var(--panel);
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .question { font-size: 1.4rem; color: var(--blue-dark); margin-bottom: 10px; text-align: center; font-weight: 700; }
        .question-counter { font-size: 1.15rem; color: var(--blue-700); font-weight: 800; margin-bottom: 15px; text-align: center; }
        .multiplication { font-size: 2.6rem; color: var(--blue-600); font-weight: 900; margin: 20px 0; text-align: center; font-family:'Courier New',monospace; }
        .answer-input {
            font-size: 2rem;
            font-weight: 800;
            padding: 10px;
            border: 3px solid var(--blue-600);
            border-radius: 12px;
            text-align: center;
            width: 150px;
            margin: 20px 0;
            color: var(--blue-dark);
            font-family: 'Courier New', monospace;
        }
        .answer-input.correct { background: var(--success); color: #fff; }
        .answer-input.incorrect { background: var(--danger); color: #fff; }
        .input-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; margin: 0 auto; }
        .number-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; max-width: 400px; margin: 20px auto; }
        .number-btn {
            background: var(--white);
            border: 2px solid #e5e9f0;
            border-radius: 14px;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: inherit;
            color: var(--blue-700);
            cursor: pointer;
            transition: all var(--tr);
            width: 68px;
            height: 68px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,.06);
        }
        .number-btn:hover { background: linear-gradient(135deg, var(--blue-600), #1d3f96); color: #fff; border-color: var(--blue-600); transform: translateY(-3px); }
        .delete-btn { width: 100%; height: 68px; margin: 10px auto 0; font-size: 1.1rem; }
        .control-buttons { display: flex; gap: 15px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .feedback {
            background: rgba(239,68,68,.12);
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 12px;
            margin: 10px 0;
            font-weight: 700;
            text-align: center;
            width: 100%;
        }
        .final-screen { text-align: center; padding: 10px; }
        .final-level { font-size: clamp(1.6rem,5vw,2.2rem); color: var(--blue-dark); font-weight: 900; margin-bottom: 6px; }
        .final-table { font-size: 1.4rem; color: var(--blue-700); font-weight: 700; margin-bottom: 16px; }
        .score { font-size: clamp(2.4rem,8vw,3.4rem); color: var(--blue-600); font-weight: 900; margin: 16px 0; }
        .trophy { font-size: 5rem; animation: bounce 1s infinite; margin: 20px 0; }
        @keyframes bounce { 0%,20%,50%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-10px);} 60%{transform:translateY(-5px);} }
        .firework { position: absolute; width: 5px; height: 5px; border-radius: 50%; animation: firework-explode 1.5s ease-out forwards; }
        .confetti { position: fixed; width: 10px; height: 10px; border-radius: 50%; animation: cfall 3s linear forwards; z-index: 999; pointer-events: none; }
        @keyframes cfall { 0%{transform:translate(0,-10px) rotate(0);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) rotate(360deg);opacity:0} }
        @keyframes firework-explode {
            0% { transform: translateY(0); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translateY(var(--y)) translateX(var(--x)); opacity: 0; }
        }
        .logo { max-width: 150px; margin: 20px auto; border-radius: 8px; }
        .credits { font-weight: 700; color: #555; font-size: .88rem; margin: 15px 0; font-style: normal; }
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,.5);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; animation: fadeIn .3s ease; }
        .modal-content {
            background: var(--white); padding: 26px; border-radius: 16px;
            text-align: center; max-width: 420px; width: 90%; max-height: 85vh; overflow-y: auto;
        }
        .instruction-text { font-size: 1.1rem; color: var(--blue-700); margin-bottom: 12px; font-style: normal; font-weight: 800; }
        .answer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 20px 0; max-width: 500px; }
        .answer-grid .card { padding: 22px; font-size: 1.3rem; }
        .home-image { max-width: 280px; width: 100%; height: auto; margin-top: 24px; border-radius: 14px; }
        .score-info { display: flex; justify-content: center; align-items: center; margin: 15px 0; font-size: 1.05rem; color: var(--blue-dark); gap: 8px; }
        .score-label { font-weight: 800; }
        .score-counter {
            background: var(--panel); border: 2px solid var(--blue-600); border-radius: 10px;
            padding: 5px 15px; font-weight: 800; min-width: 60px; text-align: center; color: var(--blue-700);
        }
        .penalty { color: var(--danger); }
        .game-screen .control-buttons { width: 100%; max-width: 500px; margin: 20px auto; }

        /* Cronómetro (ancho fijo real, para que no "vibre" al cambiar de cifras) */
        .game-header { display: flex; justify-content: center; margin-bottom: 10px; }
        .timer {
            font-weight: 900; color: var(--blue-700); font-size: 1.1rem;
            background: var(--panel); padding: 6px 16px; border-radius: 20px;
            font-variant-numeric: tabular-nums; width: 120px; text-align: center;
            display: inline-block; white-space: nowrap;
        }

        /* Hall of Fame / pantalla de puntuaciones */
        .hof-level-tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
        .hof-level-tab {
            background: var(--panel); color: var(--blue-700); border: 2px solid transparent;
            border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: .95rem;
            cursor: pointer; font-family: inherit; transition: all var(--tr);
        }
        .hof-level-tab.active { background: var(--blue-600); color: #fff; border-color: var(--blue-600); }
        .hall-of-fame-table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-bottom: 10px; }
        .hall-of-fame-table th { background: var(--blue-600); color: #fff; padding: 8px 6px; text-align: left; }
        .hall-of-fame-table td { padding: 7px 6px; border-bottom: 1px solid #ddd; text-align: left; }
        .hall-of-fame-table tr:nth-child(even) { background-color: var(--panel); }
        .hall-of-fame-loading, .hall-of-fame-error { padding: 16px; text-align: center; color: var(--blue-700); font-style: italic; }
        .hall-of-fame-error { color: var(--red); }

        /* Modal de envío de puntuación */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 1999;
        }
        .modal-overlay.active { display: flex; }
        .modal-input { width: 100%; padding: 10px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit; }
        .modal-validation-msg { color: var(--red); font-size: .9rem; font-weight: 700; margin: -4px 0 10px; text-align: center; }
        .modal-validation-msg.hidden { display: none; }
        @keyframes shakeMsg { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-5px);} 40%{transform:translateX(5px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
        .shake { animation: shakeMsg .4s ease; }

        @media (max-width: 768px) {
            .game-container { padding: 20px; margin: 10px; }
            .columns { flex-direction: row; flex-wrap: wrap; }
            .column { flex: 1 1 45%; min-width: 45%; }
            .table-buttons { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 2rem; }
            .multiplication { font-size: 2rem; }
            .card { font-size: 1rem; padding: 12px; }
            .number-btn { width: 55px; height: 55px; font-size: 1.2rem; padding: 10px; }
            .delete-btn { height: 55px; font-size: 1.1rem; }
            .answer-grid { gap: 8px; max-width: 90vw; margin: 15px auto; }
            .answer-grid .card { padding: 15px; font-size: 1.2rem; }
            .question-area .control-buttons .btn-blue { width: 100%; max-width: 300px; }
            .input-container { max-width: 320px; }
            .number-pad { max-width: 320px; gap: 8px; }
            .instruction-text { font-size: 1.05rem; }
            .score-info { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Pantalla inicial -->
        <div id="home-screen" class="screen active">
            <h1>Juego de Tablas de Multiplicar</h1>
            <p class="subtitle">Elige tu nivel de dificultad</p>
            <div class="level-buttons">
                <button class="btn" onclick="selectLevel('inicial')">Inicial</button>
                <button class="btn" onclick="selectLevel('intermedio')">Intermedio</button>
                <button class="btn" onclick="selectLevel('avanzado')">Avanzado</button>
                <button class="btn" onclick="selectLevel('experto')">Experto</button>
                <button class="btn btn-dark-blue" onclick="showScoresScreen()">🏆 Ver puntuaciones</button>
            </div>
            <img src="https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/refs/heads/main/Ni%C3%B1os.png" alt="Niños estudiando" class="home-image">
        </div>
        <!-- Pantalla de puntuaciones (Hall of Fame) -->
        <div id="scores-screen" class="screen">
            <h1>🏆 Mejores puntuaciones 🏆</h1>
            <p class="subtitle">El mejor jugador de cada tabla, en cada nivel</p>
            <div class="hof-level-tabs" id="hofLevelTabs">
                <button class="hof-level-tab active" data-level="inicial" onclick="showHofLevel('inicial')">Inicial</button>
                <button class="hof-level-tab" data-level="intermedio" onclick="showHofLevel('intermedio')">Intermedio</button>
                <button class="hof-level-tab" data-level="avanzado" onclick="showHofLevel('avanzado')">Avanzado</button>
                <button class="hof-level-tab" data-level="experto" onclick="showHofLevel('experto')">Experto</button>
            </div>
            <table class="hall-of-fame-table">
                <thead>
                    <tr><th>Tabla</th><th>Ganador</th><th>Puntos</th><th>Tiempo</th></tr>
                </thead>
                <tbody id="hofTableBody"></tbody>
            </table>
            <div class="control-buttons">
                <button class="btn btn-orange" onclick="goHome()">Volver al menú</button>
            </div>
        </div>
        <!-- Pantalla de selección de tabla -->
        <div id="table-select-screen" class="screen">
            <h2 id="level-instruction" class="level-title"></h2>
            <p class="subtitle">Elige la tabla que quieres repasar</p>
            <div class="table-buttons">
                <button class="btn" onclick="startGame(2)">Tabla 2</button>
                <button class="btn" onclick="startGame(3)">Tabla 3</button>
                <button class="btn" onclick="startGame(4)">Tabla 4</button>
                <button class="btn" onclick="startGame(5)">Tabla 5</button>
                <button class="btn" onclick="startGame(6)">Tabla 6</button>
                <button class="btn" onclick="startGame(7)">Tabla 7</button>
                <button class="btn" onclick="startGame(8)">Tabla 8</button>
                <button class="btn" onclick="startGame(9)">Tabla 9</button>
            </div>
        </div>
        <!-- Pantalla de juego -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div id="timer" class="timer">00:00.00</div>
            </div>
            <div id="game-area" class="game-area"></div>
            <div class="control-buttons">
                <button class="btn btn-orange" onclick="showConfirmModal('restart'); reproducirSonido('tap')">Reiniciar</button>
                <button class="btn btn-orange" onclick="showConfirmModal('menu'); reproducirSonido('tap')">Volver al menú</button>
            </div>
        </div>
        <!-- Pantalla final -->
        <div id="final-screen" class="screen">
            <div class="final-screen">
                <div id="final-level" class="final-level"></div>
                <div id="final-table" class="final-table"></div>
                <div id="final-score" class="score"></div>
                <div id="final-time-display" class="final-table"></div>
                <div id="final-message"></div>
                <div id="trophy-area"></div>
                <p class="credits">Creado por Manuel J. Ventura</p>
                <button class="btn btn-orange" onclick="goHome()">Volver a jugar</button>
                <div class="logo">
                    <img src="https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/1e2a36cdd1f8bedcb578a30f5ec5cc8f21c287fe/Siurot.png" alt="Logo del colegio" style="max-width: 100%; height: auto;">
                </div>
            </div>
        </div>
    </div>
    <!-- Modal de confirmación -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <p id="confirm-message"></p>
            <div class="control-buttons">
                <button class="btn btn-green" onclick="confirmAction(true); reproducirSonido('tap')">Sí</button>
                <button class="btn btn-red" onclick="confirmAction(false); reproducirSonido('tap')">No</button>
            </div>
        </div>
    </div>
    <!-- Modal de envío de puntuación (Hall of Fame) -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-content">
            <h2 style="color:var(--blue-dark);margin-bottom:10px;">¡Ronda terminada!</h2>
            <p style="color:var(--blue-700);margin-bottom:14px;">Tu tiempo: <span id="modalTime">00:00.00</span></p>
            <input class="modal-input" id="playerName" placeholder="Nombre" maxlength="15">
            <input class="modal-input" id="playerSurname" placeholder="Apellido" maxlength="15">
            <p id="modalValidationMsg" class="modal-validation-msg hidden"></p>
            <div class="control-buttons">
                <button class="btn btn-orange" id="submitScoreBtn" onclick="submitScore()">Guardar</button>
                <button class="btn btn-light-blue" id="discardScoreBtn" onclick="discardScore()">Cancelar</button>
            </div>
        </div>
    </div>
    <script>
        // Configuración del Hall of Fame
        const SHEET_NAME = "Tablas";
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYNz7wXhyUFzbEMoS1023ubcqPYrs1FDnlfAw8mFzd2JPIh52FZedik_oZNGkP4LaE/exec";

        // Variables globales
        let currentLevel = '';
        let currentTable = 0;
        let gameData = [];
        let attempts = 0;
        let errors = 0;
        let selectedCards = [];
        let currentQuestion = 0;
        let flippedCards = 0;
        let correctPairs = 0;
        let pendingAction = '';
        let selectedCard = null; // Para nivel avanzado
        let waitingForContinue = false; // Para nivel intermedio
        let penaltyPoints = 0; // Puntos de penalización para nivel avanzado

        // Cronómetro (mide la ronda completa: las 10 preguntas de esa tabla)
        let gameStartTime = null;
        let timerInterval = null;
        let lastElapsedSeconds = 0;

        // Hall of Fame
        let hofData = null; // caché de las filas leídas del Sheet
        let hofCurrentLevel = 'inicial';
        let isHofLoading = false;
        let isSubmittingScore = false;
        
        // PASO 1: Crear los objetos Audio con enlaces RAW
        const sonidos = {
            correcto: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/7b86808e254100aeaba6285b3e0b82650ae78055/Correcto.mp3'),
            error: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/7b86808e254100aeaba6285b3e0b82650ae78055/Error.mp3'),
            completado: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/refs/heads/main/Completado.mp3'),
            victoria: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/7b86808e254100aeaba6285b3e0b82650ae78055/Termin%C3%A9.mp3'),
            tap: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/37b3eb2da9c15c04dfb71dfe1be60f088ea3cdfc/Tap.mp3'),
            final: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/0b28bf817be00a46c460204ed9127cfd919eea3c/Final.mp3')
        };
        
        // Precargar sonidos
        Object.values(sonidos).forEach(sound => {
            sound.preload = 'auto';
            sound.volume = 0.5;
        });
        
        // PASO 2: Desbloquear el audio con el primer toque, sin reproducir (ni sea
        // un instante) cada sonido -- así no se oye ningún sonido "fantasma" (como
        // el de error) al primer clic en cualquier botón, sea cual sea.
        let audioContext = null;
        function unlockAudio() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {}
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {});
            }
        }
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('keydown', unlockAudio, { once: true });
        
        // PASO 3: Función para reproducir sonidos
        function reproducirSonido(nombre) {
            const audio = sonidos[nombre];
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Error al reproducir audio:", e));
        }
        
        function selectLevel(level) {
            reproducirSonido('tap');
            currentLevel = level;
            
            const instructions = {
                'inicial': 'Empareja cada multiplicación with su resultado',
                'intermedio': 'Elige el resultado correcto para cada multiplicación',
                'avanzado': 'Multiplicaciones visibles, respuestas ocultas. ¡Encuéntralas!',
                'experto': 'Escribe el resultado de cada multiplicación'
            };
            
            document.getElementById('level-instruction').textContent = instructions[level];
            showScreen('table-select-screen');
        }
        
        function startGame(table) {
            reproducirSonido('tap');
            currentTable = table;
            attempts = 0;
            errors = 0;
            selectedCards = [];
            currentQuestion = 0;
            flippedCards = 0;
            correctPairs = 0;
            selectedCard = null; // Resetear para nivel avanzado
            waitingForContinue = false; // Resetear para nivel intermedio
            penaltyPoints = 0; // Resetear penalización para nivel avanzado
            
            generateGameData();
            renderGame();
            showScreen('game-screen');

            // Arrancamos el cronómetro de la ronda completa
            gameStartTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 30);
            updateTimer();
        }

        // Formatea milisegundos como MM:SS.CC (centésimas), igual que en el resto de juegos
        function formatTime(ms) {
            const totalCentisecs = Math.floor(ms / 10);
            const centisecs = totalCentisecs % 100;
            const totalSecs = Math.floor(totalCentisecs / 100);
            const sec = totalSecs % 60;
            const mins = Math.floor(totalSecs / 60);
            return `${mins.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${centisecs.toString().padStart(2, '0')}`;
        }

        function formatTimeFromSeconds(value) {
            const secondsNum = parseFloat(value);
            if (isNaN(secondsNum)) return '00:00.00';
            return formatTime(secondsNum * 1000);
        }

        function updateTimer() {
            if (!gameStartTime) return;
            document.getElementById('timer').textContent = formatTime(Date.now() - gameStartTime);
        }
        
        function generateGameData() {
            gameData = [];
            for (let i = 1; i <= 10; i++) {
                gameData.push({
                    multiplication: `${currentTable} × ${i}`,
                    result: currentTable * i,
                    matched: false,
                    flipped: false
                });
            }
            
            // Shuffle para todos los niveles
            gameData = shuffleArray(gameData);
        }
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function renderGame() {
            const gameArea = document.getElementById('game-area');
            
            switch (currentLevel) {
                case 'inicial':
                    renderInicialGame(gameArea);
                    break;
                case 'intermedio':
                    renderIntermedioGame(gameArea);
                    break;
                case 'avanzado':
                    renderAvanzadoGame(gameArea);
                    break;
                case 'experto':
                    renderExpertoGame(gameArea);
                    break;
            }
        }

                    <div class="column" id="result-column">

        function selectCard(element, type, value) {
            reproducirSonido('tap');
            
            // Deseleccionar otras tarjetas del mismo tipo
            document.querySelectorAll(`[data-type="${type}"].selected`).forEach(card => {
                card.classList.remove('selected');
            });
            
            element.classList.add('selected');
            
            if (type === 'mult') {
                selectedCards[0] = { type, value, element };
            } else {
                selectedCards[1] = { type, value, element };
            }
            
            // Verificar emparejamiento
            if (selectedCards[0] && selectedCards[1]) {
                attempts++;
                const multIndex = selectedCards[0].value;
                const resultValue = selectedCards[1].value;
                
                if (gameData[multIndex].result === resultValue) {
                    // Correcto
                    selectedCards[0].element.classList.add('correct');
                    selectedCards[1].element.classList.add('correct');
                    selectedCards[0].element.onclick = null;
                    selectedCards[1].element.onclick = null;
                    gameData[multIndex].matched = true;
                    correctPairs++;
                    reproducirSonido('correcto');
                    
                    if (correctPairs === gameData.length) {
                        setTimeout(() => {
                            endGame();
                        }, 1000);
                    }
                } else {
                    // Incorrecto
                    reproducirSonido('error');
                    setTimeout(() => {
                        selectedCards[0].element.classList.remove('selected');
                        selectedCards[1].element.classList.remove('selected');
                    }, 1000);
                    errors++;
                }
                
                selectedCards = [];
            }
        }
        
        function selectResult(value) {
            // Si estamos esperando a que el usuario presione continuar, ignorar clics
            if (waitingForContinue) {
                return;
            }
            
            reproducirSonido('tap');
            const currentData = gameData[currentQuestion];
            const feedback = document.getElementById('feedback');
            const continueArea = document.getElementById('continue-area');
            
            if (currentData.result === value) {
                reproducirSonido('correcto');
                // Si es correcto, avanzar automáticamente después de un tiempo
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= gameData.length) {
                        endGame();
                    } else {
                        renderGame();
                    }
                }, 1000);
            } else {
                reproducirSonido('error');
                errors++;
                // Mostrar feedback con la solución correcta
                feedback.innerHTML = `<div class="feedback">Respuesta correcta: ${currentData.result}</div>`;
                // Mostrar botón de continuar
                continueArea.innerHTML = '<div class="control-buttons"><button class="btn btn-light-blue" onclick="nextQuestion()">Continuar</button></div>';
                waitingForContinue = true;
            }
        }
        
        function selectAdvancedCard(element, type, index) {
            reproducirSonido('tap');
            
            // Si no hay ninguna tarjeta seleccionada
            if (!selectedCard) {
                // Seleccionar la tarjeta
                element.classList.add('selected');
                selectedCard = { type, index, element };
                return;
            }
            
            // Si se selecciona otra tarjeta de la misma columna
            if (selectedCard.type === type) {
                // Deseleccionar la tarjeta anterior y seleccionar la nueva
                selectedCard.element.classList.remove('selected');
                element.classList.add('selected');
                selectedCard = { type, index, element };
                return;
            }
            
            // Obtener los valores de las tarjetas
            const firstCard = selectedCard;
            const secondCard = { type, index, element };
            
            // Determinar cuál es la tarjeta de multiplicación y cuál la de resultado
            let multCard, resultCard;
            if (firstCard.type === 'mult') {
                multCard = firstCard;
                resultCard = secondCard;
            } else {
                multCard = secondCard;
                resultCard = firstCard;
            }
            
            // Obtener el valor de la multiplicación y el resultado
            const multValue = parseInt(multCard.element.getAttribute('data-value'));
            const resultValue = parseInt(resultCard.element.getAttribute('data-value'));
            
            // Quitar la selección de las tarjetas
            multCard.element.classList.remove('selected');
            resultCard.element.classList.remove('selected');
            
            // Si la tarjeta de resultado está oculta, mostrarla sin animación
            if (resultCard.element.classList.contains('hidden')) {
                resultCard.element.classList.remove('hidden');
            }
            
            // Comprobar si es una pareja correcta después de un breve retraso
            setTimeout(() => {
                if (multValue === resultValue) {
                    // Correcto
                    multCard.element.classList.add('correct');
                    resultCard.element.classList.add('correct');
                    
                    // Marcar como emparejadas
                    multCard.element.setAttribute('data-matched', 'true');
                    resultCard.element.setAttribute('data-matched', 'true');
                    
                    correctPairs++;
                    reproducirSonido('correcto');
                    
                    // Comprobar si se han encontrado todas las parejas
                    if (correctPairs === 10) {
                        setTimeout(() => {
                            endGame();
                        }, 1000);
                    }
                } else {
                    // Incorrecto
                    // Incrementar el contador de intentos solo para errores
                    attempts++;
                    
                    // La tarjeta de resultado se oculta nuevamente sin animación
                    setTimeout(() => {
                        resultCard.element.classList.add('hidden');
                    }, 800); // Tiempo de visión de 800ms
                    
                    reproducirSonido('error');
                    
                    // Actualizar el contador de oportunidades
                    updateAdvancedGameUI();
                }
                
                // Resetear la selección
                selectedCard = null;
            }, 100);
        }
        
        function updateAdvancedGameUI() {
            // Calcular oportunidades restantes
            const remainingChances = Math.max(0, 10 - attempts);
            const scoreLabel = attempts <= 10 ? "Oportunidades restantes" : "Penalización";
            
            // Si estamos en modo penalización, actualizar penaltyPoints
            if (attempts > 10) {
                penaltyPoints += 10;
            }
            
            const scoreValue = attempts <= 10 ? remainingChances : `-${penaltyPoints}`;
            
            // Actualizar la interfaz para mostrar el contador actualizado
            const scoreInfoElements = document.querySelectorAll('.score-info');
            scoreInfoElements.forEach(element => {
                const labelElement = element.querySelector('.score-label');
                const counterElement = element.querySelector('.score-counter');
                
                if (labelElement) labelElement.textContent = scoreLabel + ':';
                if (counterElement) {
                    counterElement.textContent = scoreValue;
                    if (attempts > 10) {
                        counterElement.classList.add('penalty');
                    } else {
                        counterElement.classList.remove('penalty');
                    }
                }
            });
        }
        
        function inputNumber(num) {
            reproducirSonido('tap');
            const input = document.getElementById('answer-input');
            input.value += num;
        }
        
        function deleteLastDigit() {
            reproducirSonido('tap');
            const input = document.getElementById('answer-input');
            input.value = input.value.slice(0, -1);
        }
        
        function checkAnswer() {
            const input = document.getElementById('answer-input');
            const userAnswer = parseInt(input.value);
            const correctAnswer = gameData[currentQuestion].result;
            const feedback = document.getElementById('feedback');
            
            if (userAnswer === correctAnswer) {
                input.classList.add('correct');
                reproducirSonido('correcto');
                // Si la respuesta es correcta, pasar automáticamente a la siguiente pregunta
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= gameData.length) {
                        endGame();
                    } else {
                        renderGame();
                    }
                }, 1000);
            } else {
                input.classList.add('incorrect');
                feedback.innerHTML = `<div class="feedback">Respuesta correcta: ${correctAnswer}</div>`;
                reproducirSonido('error');
                errors++;
                // Si hay error, mostrar el botón de continuar
                document.querySelector('.control-buttons').innerHTML = '<button class="btn btn-light-blue" onclick="nextQuestion()">Continuar</button>';
            }
        }
        
        function nextQuestion() {
            waitingForContinue = false; // Resetear el estado de espera para nivel intermedio
            currentQuestion++;
            if (currentQuestion >= gameData.length) {
                endGame();
            } else {
                renderGame();
            }
        }
        
        function calculateScore() {
            let score = 0;
            
            switch (currentLevel) {
                case 'inicial':
                    score = Math.round((10 / attempts) * 100);
                    break;
                case 'intermedio':
                    score = Math.max(0, (10 - errors) * 10);
                    break;
                case 'avanzado':
                    // Nueva fórmula: 9 errores sin restar puntos, a partir del error 10 se restan 10 puntos por cada error
                    score = Math.max(0, 100 - penaltyPoints);
                    break;
                case 'experto':
                    score = Math.max(0, (10 - errors) * 10);
                    break;
            }
            
            return Math.min(100, Math.max(0, score));
        }
        
        function endGame() {
            const score = calculateScore();

            // Congelamos el cronómetro: ese es el tiempo final de la ronda
            clearInterval(timerInterval);
            const elapsedMs = gameStartTime ? (Date.now() - gameStartTime) : 0;
            lastElapsedSeconds = elapsedMs / 1000;
            document.getElementById('timer').textContent = formatTime(elapsedMs);
            
            // Mostrar nivel y tabla por separado
            document.getElementById('final-level').textContent = 
                `Nivel ${currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1)}`;
            document.getElementById('final-table').textContent = 
                `Tabla del ${currentTable}`;
            
            document.getElementById('final-score').textContent = `${score} puntos`;
            document.getElementById('final-time-display').textContent = `Tiempo: ${formatTime(elapsedMs)}`;
            
            const trophyArea = document.getElementById('trophy-area');
            const messageArea = document.getElementById('final-message');
            
            if (score === 100) {
                messageArea.innerHTML = '<h3>¡Excelente! ¡Puntuación perfecta!</h3>';
                trophyArea.innerHTML = '<div class="trophy">🏆</div>';
                createFireworks();
                createConfetti();
                reproducirSonido('victoria');
            } else {
                messageArea.innerHTML = '<h3>¡Buen trabajo! Sigue practicando.</h3>';
                trophyArea.innerHTML = '';
                reproducirSonido('completado');
            }
            
            showScreen('final-screen');
            showSubmitModal();
        }

        function createFireworks() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8c00'];
            
            // Crear múltiples fuegos artificiales
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.5;

                    for (let j = 0; j < 30; j++) {

        /* ====================================================
           HALL OF FAME
        ===================================================== */
        let hofLoadCallbacks = []; // callbacks en espera si ya hay una carga en curso

        // Pide todas las filas guardadas y las deja en caché (hofData), agrupadas
        // por nivel+tabla quedándonos solo con el ganador de cada combinación
        // (mayor puntuación; en caso de empate, menor tiempo).
        function loadHofData(callback) {
            if (hofData !== null) {
                // Ya tenemos los datos en caché (o cambiaron de pestaña rápido y ya
                // hay una petición en curso): la atendemos sin lanzar otra petición.
                if (callback) callback();
                return;
            }
            hofLoadCallbacks.push(callback);
            if (isHofLoading) return; // ya hay una petición en marcha; se avisará al terminar
            isHofLoading = true;

            const url = `${APP_SCRIPT_URL}?action=read&sheet=${SHEET_NAME}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            fetch(url, { signal: controller.signal })
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                .then(data => {
                    clearTimeout(timeoutId);
                    isHofLoading = false;
                    const rows = (data.status === 'success' && data.data) ? data.data : [];

                    // Nos quedamos solo con el ganador de cada nivel+tabla
                    const winners = {}; // winners['inicial-5'] = {name,surname,score,time}
                    rows.forEach(row => {
                        const key = `${row.level}-${row.table}`;
                        const score = parseInt(row.score, 10);
                        const time = parseFloat(row.time);
                        const current = winners[key];
                        if (!current || score > current.score || (score === current.score && time < current.time)) {
                            winners[key] = { name: row.name, surname: row.surname, score, time, table: row.table, level: row.level };
                        }
                    });

                    hofData = winners;
                    const callbacks = hofLoadCallbacks; hofLoadCallbacks = [];
                    callbacks.forEach(cb => { if (cb) cb(); });
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    isHofLoading = false;
                    console.error('Error cargando Hall of Fame:', err);
                    hofData = {};
                    const callbacks = hofLoadCallbacks; hofLoadCallbacks = [];
                    callbacks.forEach(cb => { if (cb) cb(err); });
                });
        }

            // Usamos hofCurrentLevel (no el "level" capturado al llamar) para que,
            // si el usuario cambia de pestaña mientras carga, se pinte siempre la
            // pestaña que esté activa cuando lleguen los datos, no una desfasada.
            loadHofData(() => renderHofTable(hofCurrentLevel));

        function submitScore() {
            if (isSubmittingScore) return;

            const name = document.getElementById('playerName').value.trim();
            const surname = document.getElementById('playerSurname').value.trim();
            const score = calculateScore();
            const time = Math.round(lastElapsedSeconds * 100) / 100;
            const validationMsg = document.getElementById('modalValidationMsg');

            if (!name || !surname) {
                validationMsg.textContent = 'Por favor, rellena nombre y apellido';
                validationMsg.classList.remove('hidden');
                validationMsg.classList.remove('shake');
                void validationMsg.offsetWidth;
                validationMsg.classList.add('shake');
                reproducirSonido('error');
                return;
            }
            validationMsg.classList.add('hidden');

            isSubmittingScore = true;
            const btn = document.getElementById('submitScoreBtn');
            btn.textContent = 'Enviando...';
            const payload = {
                sheet: SHEET_NAME,
                action: 'write',
                data: { score, time, name, surname, level: currentLevel, table: currentTable }
            };

            fetch(APP_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(() => {
                setTimeout(() => {
                    document.getElementById('submitModal').classList.remove('active');
                    btn.textContent = 'Guardar';
                    isSubmittingScore = false;
                    hofData = null; // invalidar caché para que se recargue con el nuevo dato
                }, 1500);
            }).catch(e => {
                console.log('Error:', e);
                btn.textContent = 'Guardar';
                isSubmittingScore = false;
            });
        }

        function discardScore() {
            reproducirSonido('tap');
            document.getElementById('submitModal').classList.remove('active');
        }
    </script>
</body>
</html>
